name: Java tekshiruv

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore: ['**.md']

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: Java kompilyatsiya (native'siz, tez)
        run: ./gradlew :TMessagesProj:compileReleaseJavaWithJavac --no-daemon 2>&1 | tail -150
        shell: bash -o pipefail {0}
