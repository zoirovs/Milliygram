name: Milliygram Google Play (AAB)

# Google Play uchun alohida yig'ish (25.11.2026).
# Play'dagi eski sahifa paketi com.milliy.telegram (2021-2022 yildan), shu sahifaga yuklanadi.
# Oddiy APK (build.yml) o'zgarmaydi.

on:
  workflow_dispatch:

env:
  PLAY_PACKAGE: com.milliy.telegram
  # Play'dagi oxirgi versiya kodi 1555965839 (1.0.24) — yangisi undan katta bo'lishi shart
  PLAY_VERSION_BASE: 1556000000

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Disk joyini bo'shatish
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: NDK va CMake o'rnatish
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          for i in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null && exit 0
            echo "Urinish $i muvaffaqiyatsiz, qayta..."; sleep 20
          done
          exit 1

      - name: Imzo kaliti va API kalitlari
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 -d > TMessagesProj/config/release.keystore
          sed -i "s/^RELEASE_KEY_PASSWORD=.*/RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD/; s/^RELEASE_KEY_ALIAS=.*/RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS/; s/^RELEASE_STORE_PASSWORD=.*/RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD/" gradle.properties
          B=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i "s/APP_ID = [0-9]*;/APP_ID = $APP_ID;/; s/APP_HASH = \"[^\"]*\"/APP_HASH = \"$APP_HASH\"/" $B
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > TMessagesProj_App/google-services.json
          fi

      - name: Play sozlamalari (paket, versiya kodi, ruxsatlar)
        run: |
          set -e
          VC=$((PLAY_VERSION_BASE + GITHUB_RUN_NUMBER))
          sed -i "s/^APP_PACKAGE=.*/APP_PACKAGE=$PLAY_PACKAGE/; s/^APP_VERSION_CODE=.*/APP_VERSION_CODE=$VC/" gradle.properties
          # Firebase konfiguratsiyasi paket nomiga mos bo'lishi kerak (aks holda build yiqiladi)
          sed -i "s/uz\.milliygram\.app/$PLAY_PACKAGE/g" TMessagesProj_App/google-services.json
          sed -i "s/uz\.milliygram\.app/$PLAY_PACKAGE/g" TMessagesProj/src/main/res/xml/auth_menu.xml
          sed -i "s|details?id=uz\.milliygram\.app|details?id=$PLAY_PACKAGE|" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          # Play siyosati: paket o'rnatish ruxsati Play versiyasida bo'lmaydi
          sed -i '/android.permission.REQUEST_INSTALL_PACKAGES/d' TMessagesProj/src/main/AndroidManifest.xml
          # Play siyosati: qo'ng'iroqlar jurnali faqat dialer ilovalariga ruxsat etiladi
          sed -i '/android.permission.READ_CALL_LOG/d' TMessagesProj/src/main/AndroidManifest.xml TMessagesProj/config/release/*.xml
          ! grep -lE 'REQUEST_INSTALL_PACKAGES|READ_CALL_LOG' TMessagesProj/src/main/AndroidManifest.xml TMessagesProj/config/release/*.xml
          grep -E '^APP_(PACKAGE|VERSION_CODE|VERSION_NAME)=' gradle.properties

      - name: AAB yig'ish
        run: ./gradlew :TMessagesProj_App:bundleBundleAfatRelease --no-daemon --stacktrace

      - name: AAB nomlash va tekshirish
        run: |
          set -e
          V=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)
          VC=$(grep '^APP_VERSION_CODE=' gradle.properties | cut -d= -f2)
          F=$(ls TMessagesProj_App/build/outputs/bundle/bundleAfatRelease/*.aab | head -1)
          mkdir -p out && cp "$F" "out/Milliygram-play-$V-$VC.aab"
          unzip -p "$F" base/manifest/AndroidManifest.xml | strings | grep -iE 'milliy|permission' | sort -u | head -80 || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Milliygram-play-aab
          path: out/*.aab
          retention-days: 30
